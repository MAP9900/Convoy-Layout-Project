      - "P10"
      - "P12"
      - "P13"
      - "P14"
      - "P20"
      - "P23"
      - "P26"
      - "P29"
    train_seeds:
      - 1939
      - 1940
      - 1941
    eval_seeds:
      - 1942
      - 1943
      - 1944
  objective:
    preset: "protect_hulls"
    w_total_value: 1.0
    w_unique_ships_hit: 1.5
    w_repeat_hits: 0.5
    escort_loss_discount: 0.75
    class_value_weights:
      freighter: 1.0
      tanker: 1.4
      escort: 0.6
      decoy: 0.2
  training:
    episodes: 300
    epsilon: 0.25
    epsilon_decay: 0.995
    epsilon_min: 0.02
    alpha: 0.12
    seed: 7
  rl:
    builder:
      enabled: true
      base_n_rows: 6
      base_n_cols: 7
      speed: 5.0
      heading_rad: 0.0
      length: 150.0
      beam: 20.0
      origin:
        - 0.0
        - 0.0
      layout_families:
        - "rectangular"
        - "staggered"
      fleet_profile: "mixed_convoy_v1"
      fleet_seed: 1947
      spacing_along_options:
        compact: 365.76
        standard: 457.2
        loose: 548.64
      spacing_across_options:
        compact: 914.4
        standard: 1143.0
        loose: 1371.6
      family_complexity:
        rectangular: 1.0
        staggered: 1.15
      spacing_along_complexity:
        compact: 0.0
        standard: 0.1
        loose: 0.2
      spacing_across_complexity:
        compact: 0.0
        standard: 0.05
        loose: 0.15
    selection:
      risk_cvar_weight: 0.05
      complexity_tiebreak_tolerance: 0.1
