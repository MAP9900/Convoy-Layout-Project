[run]
name = "rl_test1"
output_root = "results/runs"

[simulation]
t_max = 400.0
n_trials_per_seed = 40
max_hits_per_torpedo = 1

[simulation.noise]
sigma_heading_rad = 0.01
sigma_launch_delay = 0.05
sigma_speed_mps = 0.25
p_dud = 0.02

[simulation.environment]
time_of_day = "night"
visibility_m = 3500.0
sea_state = 4
detection_risk_scale = 1.0

[simulation.ship_movement_realism]
position_jitter_std_m = 8.0
heading_jitter_std_rad = 0.015
deviation_offset_cap_m = 12.0
enable_slot_swaps = false
max_swap_fraction = 0.0
freighter_scale = 1.0
tanker_scale = 0.9
escort_scale = 0.6
decoy_scale = 1.1

[splits]
train_profiles = ["P01", "P02", "P04", "P05", "P06", "P07", "P09", "P11", "P15", "P16", "P17", "P18", "P19", "P21", "P22", "P24", "P25", "P27", "P28", "P30"]
eval_profiles = ["P03", "P08", "P10", "P12", "P13", "P14", "P20", "P23", "P26", "P29"]
train_seeds = [1939, 1940, 1941]
eval_seeds = [1942, 1943, 1944]

[training]
episodes = 300
epsilon = 0.25
epsilon_decay = 0.995
epsilon_min = 0.02
alpha = 0.12
seed = 7

[rl]

[rl.builder]
enabled = true
base_n_rows = 6
base_n_cols = 7
speed = 5.0
heading_rad = 0.0
length = 150.0
beam = 20.0
origin = [0.0, 0.0]
layout_families = ["rectangular", "staggered"]

[rl.builder.spacing_along_options]
