staggered = 1.15

[rl.builder.spacing_along_complexity]
compact = 0.0
standard = 0.1
loose = 0.2

[rl.builder.spacing_across_complexity]
compact = 0.0
standard = 0.05
loose = 0.15

[rl.selection]
