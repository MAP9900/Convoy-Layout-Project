[run]
name = "baseline_default"
output_root = "results/runs"

[simulation]
t_max = 400.0
n_trials_per_seed = 40
max_hits_per_torpedo = 1

[runtime]
baseline_search_n_trials_per_seed = 16

[simulation.noise]
sigma_heading_rad = 0.01
sigma_launch_delay = 0.05
sigma_speed_mps = 0.25
p_dud = 0.02

[simulation.environment]
time_of_day = "night"
visibility_m = 3500.0
sea_state = 4
detection_risk_scale = 1.0

[simulation.ship_movement_realism]
position_jitter_std_m = 8.0
heading_jitter_std_rad = 0.015
deviation_offset_cap_m = 12.0
enable_slot_swaps = false
max_swap_fraction = 0.0
freighter_scale = 1.0
tanker_scale = 0.9
escort_scale = 0.6
decoy_scale = 1.1

[splits]
train_profiles = ["P02","P03","P06","P07","P10","P11","P12","P13","P14","P15","P16","P17","P19","P20","P22","P23","P26","P27","P28","P30"]
eval_profiles = ["P01","P04","P05","P08","P09","P18","P21","P24","P25","P29"]
train_seeds = [1939, 1940, 1941]
eval_seeds = [1942, 1943, 1944]

[objective]
preset = "balanced_default"
w_total_value = 1.0
w_unique_ships_hit = 1.0
w_repeat_hits = 0.2
escort_loss_discount = 0.75

[objective.class_value_weights]
freighter = 1.0
tanker = 1.5
escort = 0.5
decoy = 0.2

[baseline.static_layout]
type = "rectangular"
n_rows = 6
n_cols = 7
spacing_along = 457.2
spacing_across = 1371.6
speed = 5.0
heading_rad = 0.0
length = 150.0
beam = 20.0
origin = [0.0, 0.0]

[baseline.heuristic_search]
max_candidates = 18

[baseline.heuristic_search.grid]
spacing_along = [365.76, 457.2, 548.64]
spacing_across = [914.4, 1143.0, 1371.6]
