[run]
name = "rl_default"
output_root = "results/runs"

[simulation]
t_max = 400.0
n_trials_per_seed = 40
max_hits_per_torpedo = 1

[simulation.noise]
sigma_heading_rad = 0.01
sigma_launch_delay = 0.05
sigma_speed_mps = 0.25
p_dud = 0.02

[simulation.environment]
time_of_day = "night"
visibility_m = 3500.0
sea_state = 4
detection_risk_scale = 1.0

[simulation.ship_movement_realism]
position_jitter_std_m = 8.0
heading_jitter_std_rad = 0.015
deviation_offset_cap_m = 12.0
enable_slot_swaps = false
max_swap_fraction = 0.0
freighter_scale = 1.0
tanker_scale = 0.9
escort_scale = 0.6
decoy_scale = 1.1

[splits]
train_profiles = ["P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08", "P09", "P10", "P11", "P12"]
eval_profiles = ["P13", "P14", "P15", "P16", "P17", "P18", "P19", "P20", "P21", "P22", "P23", "P24", "P25"]
train_seeds = [301, 302, 303]
eval_seeds = [401, 402, 403]

[objective]
preset = "balanced_default"
w_total_value = 1.0
w_unique_ships_hit = 1.0
w_repeat_hits = 0.2
escort_loss_discount = 0.75

[objective.class_value_weights]
freighter = 1.0
tanker = 1.5
escort = 0.5
decoy = 0.2

[training]
episodes = 300
epsilon = 0.25
epsilon_decay = 0.995
epsilon_min = 0.02
alpha = 0.12
seed = 7

[rl]

[rl.builder]
enabled = true
base_n_rows = 6
base_n_cols = 7
speed = 5.0
heading_rad = 0.0
length = 150.0
beam = 20.0
origin = [0.0, 0.0]
layout_families = ["rectangular", "staggered"]
fleet_profile = "mixed_convoy_v1"
fleet_seed = 1947
row_offset_policies = ["none", "centered_alt"]
class_placement_policies = ["mixed_balanced", "high_value_center"]

[rl.builder.row_patterns]
uniform_6x7 = [7, 7, 7, 7, 7, 7]
center_heavy_6 = [6, 7, 8, 8, 7, 6]

[rl.builder.spacing_along_options]
compact = 365.76
standard = 457.2
loose = 548.64

[rl.builder.spacing_across_options]
compact = 914.4
standard = 1143.0
loose = 1371.6

[rl.builder.family_complexity]
rectangular = 1.0
staggered = 1.15

[rl.builder.row_pattern_complexity]
uniform_6x7 = 0.0
center_heavy_6 = 0.15

[rl.builder.row_offset_complexity]
none = 0.0
centered_alt = 0.1

[rl.builder.class_placement_complexity]
mixed_balanced = 0.0
high_value_center = 0.12

[rl.builder.spacing_along_complexity]
compact = 0.0
standard = 0.1
loose = 0.2

[rl.builder.spacing_across_complexity]
compact = 0.0
standard = 0.05
loose = 0.15

[rl.selection]
risk_cvar_weight = 0.05
complexity_tiebreak_tolerance = 0.1
