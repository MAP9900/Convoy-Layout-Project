[run]
name = "rl_default"
output_root = "results/runs"

[simulation]
t_max = 400.0
n_trials_per_seed = 40
max_hits_per_torpedo = 1

[simulation.noise]
sigma_heading_rad = 0.01
sigma_launch_delay = 0.05
sigma_speed_mps = 0.25
p_dud = 0.02

[simulation.environment]
time_of_day = "night"
visibility_m = 3500.0
sea_state = 4
detection_risk_scale = 1.0

[simulation.ship_movement_realism]
position_jitter_std_m = 8.0
heading_jitter_std_rad = 0.015
deviation_offset_cap_m = 12.0
enable_slot_swaps = false
max_swap_fraction = 0.0
freighter_scale = 1.0
tanker_scale = 0.9
escort_scale = 0.6
decoy_scale = 1.1

[splits]
train_profiles = ["P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08", "P09", "P10", "P11", "P12"]
eval_profiles = ["P13", "P14", "P15", "P16", "P17", "P18", "P19", "P20", "P21", "P22", "P23", "P24", "P25"]
train_seeds = [301, 302, 303]
eval_seeds = [401, 402, 403]

[objective]
w_total_value = 1.0
w_unique_ships_hit = 1.0
w_repeat_hits = 0.2
escort_loss_discount = 0.75

[objective.class_value_weights]
freighter = 1.0
tanker = 1.5
escort = 0.5
decoy = 0.2

[training]
episodes = 300
epsilon = 0.25
epsilon_decay = 0.995
epsilon_min = 0.02
alpha = 0.12
seed = 7

[rl]

[[rl.actions]]
name = "rect_standard"
type = "rectangular"
complexity_cost = 1.0
n_rows = 6
n_cols = 7
spacing_along = 457.2
spacing_across = 1371.6
speed = 5.0
heading_rad = 0.0
length = 150.0
beam = 20.0
origin = [0.0, 0.0]

[[rl.actions]]
name = "rect_compact"
type = "rectangular"
complexity_cost = 1.1
n_rows = 6
n_cols = 7
spacing_along = 365.76
spacing_across = 1143.0
speed = 5.0
heading_rad = 0.0
length = 150.0
beam = 20.0
origin = [0.0, 0.0]

[[rl.actions]]
